[project]
name = "claude-experiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "claude-agent-sdk>=0.2.87",
    "github-copilot-sdk>=0.3.0",
    "google-adk>=1.18.0",
    "httpx>=0.28.1",
    "mcp>=1.27.2",
    "ruff>=0.15.15",
]

[project.optional-dependencies]
agent = [
    "langfuse>=4.7.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade — enforce latest Python conventions
    "B",    # flake8-bugbear — includes B003 (no monkey-patching builtins)
    "SIM",  # flake8-simplify
    "T20",  # flake8-print — no print() calls
    "S",    # flake8-bandit — security, includes unsafe dynamic attribute assignment
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # allow assert in tests
    "S603",  # subprocess calls — needed for Bash tool wrappers
    "S607",  # partial executable path — needed for CLI helpers
]

[tool.ruff.lint.per-file-ignores]
"agent/jira_client.py" = ["T20"]   # CLI scripts may use print for output
"agent/wiki_client.py" = ["T20"]
"scripts/*.py" = ["T20"]
"claude/*.py" = ["T20"]
"agent/run.py" = ["T20"]
"tests/test_agents.py" = ["T20", "E402"]
