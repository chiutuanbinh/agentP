name: Copilot Review and Approve

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Run Copilot Code Review
        id: copilot
        run: |
          # Use the GitHub CLI to trigger the Copilot review extension
          # We output the review results to a JSON file to parse the quality status
          gh copilot -i review --pr ${{ github.event.pull_request.number }} --format json > review_results.json
          
          # Check if Copilot flagged any major issues (Adjust parsing based on your exact schema)
          if grep -q '"status": "approved"' review_results.json || ! grep -q '"severity": "high"' review_results.json; then
            echo "PASSED=true" >> $GITHUB_ENV
          else
            echo "PASSED=false" >> $GITHUB_ENV
          fi

      - name: Auto-Approve Pull Request
        if: env.PASSED == 'true'
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "🤖 GitHub Copilot found no issues. Automatically approving this PR."
